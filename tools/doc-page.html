<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}" />
{{HEAD_EXTRA}}
<style>
  :root{
    --bg:#ffffff; --panel:#f7f7f8; --panel2:#f0f0f1; --border:#e5e5e5;
    --fg:#181818; --muted:#6b6b6b; --accent:#e8c500; --accent-ink:#181818;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0a0a0a; --panel:#141414; --panel2:#1f1f1f; --border:#2a2a2a;
      --fg:#fafafa; --muted:#8a8a8a; --accent:#FEDB00; --accent-ink:#0a0a0a;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important}}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px}

  .skip{
    position:absolute; left:-9999px; top:8px; z-index:100;
    background:var(--accent); color:var(--accent-ink); font-weight:700;
    padding:10px 16px; border-radius:9px; text-decoration:none;
  }
  .skip:focus{left:16px}

  /* ---- top nav (mirrors the landing page) ---- */
  header.nav{
    position:sticky; top:0; z-index:50; backdrop-filter:saturate(140%) blur(10px);
    background:color-mix(in srgb,var(--bg) 82%,transparent);
    border-bottom:1px solid var(--border);
  }
  .nav .wrap{display:flex; align-items:center; gap:14px; min-height:60px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; text-decoration:none; flex:0 0 auto}
  .brand svg{width:30px; height:30px; border-radius:8px; display:block}
  .brand .n{font-size:18px}
  .brand .n b{color:var(--accent)}
  nav.links{margin-left:auto; display:flex; gap:4px; flex-wrap:wrap}
  nav.links a{
    text-decoration:none; color:var(--muted); font-size:14px; font-weight:600;
    padding:7px 10px; border-radius:9px;
  }
  nav.links a:hover{color:var(--fg); background:var(--panel)}
  nav.links a[aria-current]{color:var(--fg); background:var(--panel2)}

{{SWITCHER_CSS}}

  /* ---- document body ---- */
  main.doc{max-width:820px; padding:38px 20px 84px}
  .doc>*:first-child{margin-top:0}
  .doc h1{font-size:clamp(28px,5vw,40px); line-height:1.15; letter-spacing:-.7px; margin:0 0 18px}
  .doc h2{font-size:clamp(21px,3.4vw,27px); letter-spacing:-.3px; margin:44px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--border)}
  .doc h3{font-size:18px; margin:30px 0 10px}
  .doc h4{font-size:16px; margin:24px 0 8px}
  .doc h1,.doc h2,.doc h3,.doc h4{scroll-margin-top:76px}
  .doc p,.doc ul,.doc ol{margin:0 0 14px}
  .doc li{margin:5px 0}
  .doc li>ul,.doc li>ol{margin:6px 0}
  .doc a{color:var(--fg); text-decoration:underline; text-decoration-color:var(--accent); text-decoration-thickness:2px; text-underline-offset:2px}
  .doc a:hover{text-decoration-color:var(--fg)}
  .doc a:focus-visible{outline:3px solid var(--fg); outline-offset:2px; border-radius:3px}
  .doc strong{font-weight:700}
  .doc hr{border:0; border-top:1px solid var(--border); margin:34px 0}
  .doc img{max-width:100%; height:auto; border-radius:10px}

  .doc code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    font-size:.875em; background:var(--panel2); border:1px solid var(--border);
    padding:1px 5px; border-radius:6px;
  }
  .doc pre{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; overflow-x:auto; margin:0 0 16px; line-height:1.55;
  }
  .doc pre code{background:none; border:0; padding:0; font-size:13.5px}

  .doc blockquote{
    margin:0 0 16px; padding:12px 16px; color:var(--muted);
    background:var(--panel); border:1px solid var(--border);
    border-left:4px solid var(--accent); border-radius:10px;
  }
  .doc blockquote>*:last-child{margin-bottom:0}
  .doc blockquote strong{color:var(--fg)}

  /* tables scroll inside their own box so the page never scrolls sideways */
  .tw{overflow-x:auto; margin:0 0 18px; border:1px solid var(--border); border-radius:12px}
  .doc table{border-collapse:collapse; width:100%; font-size:14.5px}
  .doc th,.doc td{text-align:left; padding:10px 14px; border-bottom:1px solid var(--border); vertical-align:top}
  .doc thead th{background:var(--panel); font-weight:700; white-space:nowrap}
  .doc tbody tr:last-child td{border-bottom:0}

  .ahash{
    margin-left:10px; color:var(--muted); text-decoration:none; font-weight:400;
    opacity:0; transition:opacity .12s;
  }
  h2:hover .ahash,h3:hover .ahash,h4:hover .ahash,.ahash:focus{opacity:1}

  footer{border-top:1px solid var(--border); padding:30px 0; color:var(--muted); font-size:14px}
  footer .wrap{display:flex; gap:16px; align-items:center; flex-wrap:wrap; justify-content:space-between}
  footer a{color:var(--muted)}
  footer a:hover{color:var(--fg)}
</style>
</head>
<body>

<a class="skip" href="#content">Skip to content</a>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="{{HOME}}">
      <svg viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" rx="26" fill="#181818"/><g transform="translate(33.6,15.4) scale(0.66)" fill="none" stroke="#FEDB00" stroke-width="4" stroke-linejoin="round"><polygon points="0 25.28 39.99 45 0 70.28"/><polygon points="80 109.71 40 90 79.99 64.71"/><polygon points="39.99 0 79.99 19.71 39.99 45"/><polygon points="40 135 0 115.28 40 90"/><polygon fill="#FEDB00" points="39.99 45 79.99 64.71 40 90"/><polygon points="39.99 45 39.99 0 0 25.28"/><polygon points="40 90 40 135 80 109.71"/><polygon fill="#FEDB00" points="40 90 39.99 45 0 70.28"/></g></svg>
      <span class="n">Simple<b>Claw</b></span>
    </a>
    {{SWITCHER}}
    <nav class="links">{{NAVLINKS}}</nav>
  </div>
</header>
{{BANNER}}
<main class="wrap doc" id="content">
{{CONTENT}}
</main>

<footer>
  <div class="wrap">
    <span>{{FOOTER_LEFT}}</span>
    <span>{{FOOTER_RIGHT}}</span>
  </div>
</footer>

<script>
  /* Close the version switcher on Esc or an outside click. The <details> element
     already handles opening, keyboard focus, and screen-reader state on its own. */
  (function () {
    var sw = document.querySelector('.vsw');
    if (!sw) return;
    document.addEventListener('click', function (e) {
      if (sw.open && !sw.contains(e.target)) sw.open = false;
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && sw.open) { sw.open = false; sw.querySelector('summary').focus(); }
    });
  })();
</script>

</body>
</html>
