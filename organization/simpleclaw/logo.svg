  <g transform="translate(33.6,15.4) scale(0.66)" fill="none" stroke="#FEDB00" stroke-width="4" stroke-linejoin="round">
    <polygon points="0 25.28 39.99 45 0 70.28"/>
    <polygon points="80 109.71 40 90 79.99 64.71"/>
    <polygon points="39.99 0 79.99 19.71 39.99 45"/>
    <polygon points="40 135 0 115.28 40 90"/>
    <polygon fill="#FEDB00" points="39.99 45 79.99 64.71 40 90"/>
    <polygon points="39.99 45 39.99 0 0 25.28"/>
    <polygon points="40 90 40 135 80 109.71"/>
