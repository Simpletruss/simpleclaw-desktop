name: Docs site

# Publishes the versioned docs site to GitHub Pages.
#
# Older releases are rendered from their git tags (listed in docs/versions.json),
# so the full history is required — hence fetch-depth: 0. The build tooling is
# always taken from main, which is why a tag push checks out main rather than the
# tag: a new tag gets published once docs/versions.json on main lists it.
#
# Requires Settings → Pages → Build and deployment → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
